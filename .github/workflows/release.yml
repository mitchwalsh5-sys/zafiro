name: Release Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # Chaquopy buildPython requirement

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode and validate signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$SIGNING_PASSWORD" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 and SIGNING_PASSWORD must both be configured."
            exit 1
          fi

          mkdir -p packing
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > packing/nexus_release.jks

          keytool -list \
            -keystore packing/nexus_release.jks \
            -storepass "$SIGNING_PASSWORD" \
            -alias nexus_key >/dev/null

      - name: Build signed release APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PRELEASE_STORE_PASSWORD="$SIGNING_PASSWORD" \
            -PRELEASE_KEY_ALIAS="nexus_key" \
            -PRELEASE_KEY_PASSWORD="$SIGNING_PASSWORD"

      - name: Resolve version name
        id: version
        run: |
          VN=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          echo "name=$VN" >> "$GITHUB_OUTPUT"

      - name: Stage APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             "Zafiro-${{ steps.version.outputs.name }}.apk"

      - name: Upload APK artifact
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Zafiro-${{ steps.version.outputs.name }}
          path: Zafiro-*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            Zafiro-*.apk \
            --title "${{ github.ref_name }}" \
            --generate-notes
