name: Release Build

on:
  push:
    branches:
      - main
      - upgrade/control-1.8.1-stability
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # Chaquopy buildPython requirement

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run regression checks
        run: >-
          ./gradlew :libs:okia:testDebugUnitTest :business:agent:testDebugUnitTest
          :libs:libterm-backend-shizuku:testDebugUnitTest :agent-runtime:testDebugUnitTest
          :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace

      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-check-reports
          path: |
            **/build/reports/tests/
            app/build/reports/lint-results-debug.*

      - name: Decode and validate signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$SIGNING_PASSWORD" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 and SIGNING_PASSWORD must both be configured."
            exit 1
          fi

          mkdir -p packing
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > packing/nexus_release.jks

          keytool -list \
            -keystore packing/nexus_release.jks \
            -storepass "$SIGNING_PASSWORD" \
            -alias nexus_key >/dev/null

      - name: Build signed release APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PRELEASE_STORE_PASSWORD="$SIGNING_PASSWORD" \
            -PRELEASE_KEY_ALIAS="nexus_key" \
            -PRELEASE_KEY_PASSWORD="$SIGNING_PASSWORD"

      - name: Verify APK identity and established signing certificate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 37458270847 --repo "$GITHUB_REPOSITORY" --name Zafiro-Control-1.5.3-control --dir "$RUNNER_TEMP/control-baseline"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          OLD_APK=$(find "$RUNNER_TEMP/control-baseline" -name '*.apk' -print -quit)
          test -n "$OLD_APK"
          "$APKSIGNER" verify --print-certs "$OLD_APK" > "$RUNNER_TEMP/baseline-cert.txt"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/candidate-cert.txt"
          diff <(grep 'certificate SHA-256 digest:' "$RUNNER_TEMP/baseline-cert.txt") <(grep 'certificate SHA-256 digest:' "$RUNNER_TEMP/candidate-cert.txt")
          "$AAPT" dump badging app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/candidate-badging.txt"
          head -1 "$RUNNER_TEMP/candidate-badging.txt" > apk-verification.txt
          python3 - <<'PYCODE'
          import re
          from pathlib import Path
          line=Path("apk-verification.txt").read_text()
          assert "name='com.niki914.zafiro.control'" in line, line
          assert int(re.search(r"versionCode='(\d+)'",line).group(1)) > 14, line
          PYCODE
          cat "$RUNNER_TEMP/candidate-cert.txt" >> apk-verification.txt
          sha256sum app/build/outputs/apk/release/app-release.apk >> apk-verification.txt

      - name: Resolve version name
        id: version
        run: |
          VN=$(python3 - <<'PY'
          import json
          with open("app/build/outputs/apk/release/output-metadata.json", "r", encoding="utf-8") as f:
              print(json.load(f)["elements"][0]["versionName"])
          PY
          )
          echo "name=$VN" >> "$GITHUB_OUTPUT"

      - name: Stage APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             "Zafiro-Control-${{ steps.version.outputs.name }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zafiro-Control-${{ steps.version.outputs.name }}
          path: |
            Zafiro-Control-*.apk
            apk-verification.txt
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            Zafiro-*.apk \
            --title "${{ github.ref_name }}" \
            --generate-notes

      - name: Remove signing material
        if: always()
        run: rm -f packing/nexus_release.jks
